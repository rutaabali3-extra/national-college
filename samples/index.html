<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparison</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #182234;
      border-bottom: 1px solid #334155;
    }

    .tag {
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-original {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #64748b;
    }

    .tag-2k {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid #0284c7;
    }

    .tag-4k {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid #9333ea;
    }

    .card-body {
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .card-body img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      object-fit: contain;
    }

    .card-body video {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Images -->
  <div class="media-grid">
    <div class="card">
      <div class="card-header">
        <span class="tag tag-original">Original</span>
      </div>
      <div class="card-body">
        <img src="sample_image_before.jpeg" alt="Original" />
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="tag tag-2k">2K</span>
      </div>
      <div class="card-body">
        <img src="sample_image_after_2K.jpeg" alt="2K" />
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="tag tag-4k">4K</span>
      </div>
      <div class="card-body">
        <img src="sample_image_after_4K.jpeg" alt="4K" />
      </div>
    </div>
  </div>

  <!-- Videos -->
  <div class="media-grid">
    <div class="card">
      <div class="card-header">
        <span class="tag tag-original">Original</span>
      </div>
      <div class="card-body">
        <video controls playsinline preload="metadata">
          <source src="sample_video_before.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="tag tag-2k">2K</span>
      </div>
      <div class="card-body">
        <video controls playsinline preload="metadata">
          <source src="sample_video_after_2K.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="tag tag-4k">4K</span>
      </div>
      <div class="card-body">
        <video controls playsinline preload="metadata">
          <source src="sample_video_after_4K.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
  </div>
</div>

</body>
</html>
